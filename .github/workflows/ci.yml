name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Tests & Validation du Backend (Node.js + PostgreSQL + Prisma)
  # ──────────────────────────────────────────────────────────────────────────
  backend-check:
    name: Backend Tests (Node 20 + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: kyswa_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: serverKyswa

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: serverKyswa/package-lock.json

      - name: 📦 Installation des dépendances Backend
        run: npm ci

      - name: 🐘 Génération du client Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/kyswa_ci_test?schema=public"

      - name: 🔄 Application du schéma Prisma sur la base de test
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/kyswa_ci_test?schema=public"

      - name: 🧪 Exécution des tests automatisés
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/kyswa_ci_test?schema=public"
          TEST_DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/kyswa_ci_test?schema=public"
          JWT_SECRET: "ci_test_secret_key_123456789"
          PORT: 3000

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Validation & Compilation du Frontend (Vite + React)
  # ──────────────────────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend Build Check (Vite + React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clientKyswa

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: clientKyswa/package-lock.json

      - name: 📦 Installation des dépendances Frontend
        run: npm ci

      - name: 🏗️ Compilation du build de production (Vite)
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:3000/api"
